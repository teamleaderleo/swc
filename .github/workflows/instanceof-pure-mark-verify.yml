name: verify instanceof pure-mark experiment

on:
  push:
    branches:
      - experiment/instanceof-pure-mark

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/instanceof-pure-mark
          submodules: recursive

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format and whitespace
        run: |
          cargo fmt --all -- --check
          git diff --check

      - name: Clippy minifier
        run: cargo clippy -p swc_ecma_minifier --all-targets -- -D warnings

      - name: Regenerate library-size snapshot
        run: UPDATE=1 cargo test -p swc_ecma_minifier --test size bench_libs -- --nocapture

      - name: Verify library-size snapshot
        run: cargo test -p swc_ecma_minifier --test size bench_libs -- --nocapture

      - name: Terser no-options instanceof control
        run: cargo test -p swc_ecma_minifier --test compress dont_change_in_or_instanceof_expressions -- --nocapture

      - name: Pure-mark behavior matrix
        run: cargo test -p swc_ecma_minifier --test compress instanceof_pure_func_value -- --nocapture

      - name: Restored pure-func relational fixture
        run: cargo test -p swc_ecma_minifier --test compress pure_funcs__relational -- --nocapture

      - name: Full minifier crate
        id: full
        shell: bash
        run: |
          set +e
          cargo test -p swc_ecma_minifier --no-fail-fast 2>&1 | tee full-minifier.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full minifier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-minifier-log
          path: full-minifier.log

      - name: Fail on full minifier errors
        if: steps.full.outputs.status != '0'
        run: exit 1
