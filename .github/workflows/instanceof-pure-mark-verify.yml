name: test instanceof narrow exception candidate

on:
  push:
    branches:
      - experiment/instanceof-pure-mark

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/instanceof-pure-mark

      - name: Apply ordinary-instanceof discarded-result fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/swc_ecma_minifier/src/compress/optimize/mod.rs")
          text = path.read_text()
          old = (
              "                        | op!(\"<\")\n"
              "                        | op!(\"<=\")\n"
              "                        | op!(\">\")\n"
              "                        | op!(\">=\"),\n"
          )
          new = (
              "                        | op!(\"<\")\n"
              "                        | op!(\"<=\")\n"
              "                        | op!(\">\")\n"
              "                        | op!(\">=\")\n"
              "                        | op!(\"instanceof\"),\n"
          )
          if text.count(old) != 1:
              raise RuntimeError("binary effect-extraction list changed")
          path.write_text(text.replace(old, new, 1))

      - name: Format and compile
        run: |
          cargo fmt --all -- --check
          git diff --check
          cargo check -p swc_ecma_minifier --tests

      - name: Literal instanceof control
        run: cargo test -p swc_ecma_minifier --test compress dont_change_in_or_instanceof_expressions -- --nocapture

      - name: Pure-mark behavior matrix
        run: cargo test -p swc_ecma_minifier --test compress instanceof_pure_func_value -- --nocapture

      - name: Restored Terser relational fixture
        run: cargo test -p swc_ecma_minifier --test compress pure_funcs__relational -- --nocapture
